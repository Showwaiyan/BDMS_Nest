<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .google-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background-color: #4285F4; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .google-btn:hover { background-color: #3367D6; }
        .google-btn img { width: 20px; height: 20px; margin-right: 10px; background: white; padding: 2px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>BDMS Auth Test</h2>
        <p>Select your hospital and click login to test the Google OAuth flow.</p>
        
        <select id="hospitalSelect">
            <option value="d01f62e0-31b5-4e65-8586-661ddecc8d42">Hospital A (Yangon)</option>
            <option value="03456e22-a440-48d0-8a65-db529d3063eb">Hospital B (Mandalay)</option>
        </select>

        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Sign in with Google
        </button>
    </div>

    <script>
        function loginWithGoogle() {
            const hospitalId = document.getElementById('hospitalSelect').value;
            // Redirect the browser to the NestJS backend Google initiation route
            window.location.href = `http://localhost:3000/auth/google?hospital_id=${hospitalId}`;
        }
    </script>
</body>
</html>
